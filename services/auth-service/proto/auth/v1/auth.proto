syntax = "proto3";

package auth.v1;

option go_package = "github.com/his-platform/auth-service/gen/go/auth/v1";

service AuthService {
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Refresh(RefreshRequest) returns (TokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string access_token = 1;
}

message MeRequest {
  string access_token = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
  string required_permission = 2;
  ResourceContext resource_context = 3;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
  string tenant_id = 3;
  string organization_id = 4;
  string hospital_id = 5;
  string department_id = 6;
  string assigned_by = 7;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
  string tenant_id = 3;
}

message ListRolesRequest {
  string category = 1;
}

message ListPermissionsRequest {
  string category = 1;
  string resource = 2;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message LogoutResponse {
  bool success = 1;
}

message MeResponse {
  User user = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  User user = 2;
  repeated string permissions = 3;
}

message AssignRoleResponse {
  bool success = 1;
}

message RevokeRoleResponse {
  bool success = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string tenant_id = 4;
  string organization_id = 5;
  string hospital_id = 6;
  string department_id = 7;
  repeated string roles = 8;
  repeated string permissions = 9;
}

message Role {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string category = 4;
  bool is_system = 5;
  string description = 6;
}

message Permission {
  string id = 1;
  string name = 2;
  string resource = 3;
  string action = 4;
  string scope = 5;
  string category = 6;
  string description = 7;
}

message ResourceContext {
  string resource_id = 1;
  string tenant_id = 2;
  string organization_id = 3;
  string hospital_id = 4;
  string department_id = 5;
}